  <style>
    * { box-sizing: border-box; }

    }
    .item:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.06);
    }
    .label {
      font-size: 13px;
      color: #667085;
      margin-bottom: 5px;

    .value {

      font-weight: 600;
      word-break: break-word;

    .footer {

      padding-top: 20px;
